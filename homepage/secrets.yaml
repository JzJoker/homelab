# Maps Homepage template vars ({{HOMEPAGE_VAR_*}}) used in services.yaml to
# environment variables. Real values come from the environment (core/.env via
# the homepage container) — never hardcode secrets in this file or services.yaml.
HOMEPAGE_VAR_PIHOLE_API_KEY: ${PIHOLE_API_KEY}
HOMEPAGE_VAR_TAILSCALE_DEVICE_ID: ${TAILSCALE_DEVICE_ID}
HOMEPAGE_VAR_TAILSCALE_API_KEY: ${TAILSCALE_API_KEY}
HOMEPAGE_VAR_PORTAINER_API_KEY: ${PORTAINER_API_KEY}
HOMEPAGE_VAR_HOST_IP: ${HOST_IP}
HOMEPAGE_VAR_CADDY_DOMAIN: ${CADDY_DOMAIN}
